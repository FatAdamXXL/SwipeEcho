<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SwipeEcho</title>
<meta name="description" content="SwipeEcho — avoid the echo of your own trail from moments ago, before it catches you.">
<meta name="theme-color" content="#0a0e1a">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwipeEcho">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;
    --player:#5eead4;
    --player-glow: rgba(94,234,212,0.55);
    --echo:#a78bfa;
    --echo-glow: rgba(167,139,250,0.6);
    --treasure:#fbbf24;
    --treasure-glow: rgba(251,191,36,0.6);
    --text:#dbe4f0;
    --muted:#5b6478;
    --danger:#fb7185;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    color:var(--text);
    touch-action:none;
    user-select:none;
  }
  #game{ display:block; width:100vw; height:100vh; touch-action:none; }
  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between;
    padding:16px 20px;
    padding-top:max(16px, env(safe-area-inset-top));
    pointer-events:none;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--muted);
    z-index:5;
  }
  .hud b{ color:var(--text); font-weight:600; }
  .hud .score b{ color:var(--treasure); }
  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:rgba(10,14,26,0.85);
    backdrop-filter: blur(6px);
    z-index:10;
    padding:24px;
    overflow-y:auto;
  }
  .overlay.hidden{ display:none; }
  .title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(36px, 11vw, 68px);
    letter-spacing:0.02em;
    color:var(--player);
    text-shadow: 0 0 24px var(--player-glow), 0 0 60px var(--player-glow);
    margin:0 0 26px 0;
  }
  .legend{
    display:flex; flex-direction:column; gap:10px;
    max-width:340px;
    margin-bottom:26px;
    text-align:left;
  }
  .legend-row{ display:flex; align-items:center; gap:12px; }
  .dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .dot.player{ background:var(--player); box-shadow:0 0 10px var(--player-glow); }
  .dot.danger{ background:var(--echo); box-shadow:0 0 10px var(--echo-glow); }
  .dot.treasure{ background:var(--treasure); box-shadow:0 0 10px var(--treasure-glow); }
  .legend-text{ font-size:12.5px; line-height:1.5; color:var(--muted); }
  .legend-text b{ color:var(--text); }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:14px 34px;
    border-radius:100px;
    border:1.5px solid var(--player);
    color:var(--player);
    background:transparent;
    cursor:pointer;
    transition: box-shadow .25s ease, transform .15s ease, background .25s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:hover{ background:rgba(94,234,212,0.08); box-shadow: 0 0 26px var(--player-glow); }
  .go-score{
    font-family:'Space Grotesk', sans-serif;
    font-size:52px; font-weight:700;
    color:var(--treasure);
    text-shadow:0 0 30px var(--treasure-glow);
    margin: 6px 0 2px 0;
  }
  .go-best{ font-size:12px; letter-spacing:0.1em; color:var(--muted); margin-bottom:26px; }
  .go-label{ font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--danger); margin-bottom:10px; }
  .version-badge{ margin-top:20px; font-size:11px; letter-spacing:0.08em; color:var(--muted); opacity:0.6; }
  .mute-btn{
    margin-top:16px;
    width:38px; height:38px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    background:transparent;
    color:var(--muted);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition: border-color .2s ease, color .2s ease, transform .15s ease;
  }
  .mute-btn:hover{ border-color:var(--player); color:var(--player); }
  .mute-btn:active{ transform:scale(0.92); }
  .btn-muted{
    border-color:var(--muted);
    color:var(--muted);
  }
  .btn-muted:hover{ background:rgba(219,228,240,0.06); box-shadow:none; }
  .btn-secondary{
    margin-top:14px;
    display:none;
  }
  .btn-secondary.visible{ display:inline-block; }
  @keyframes installPulse{
    0%, 100%{ box-shadow: 0 0 0 rgba(94,234,212,0); }
    50%{ box-shadow: 0 0 22px var(--player-glow); }
  }
  #installBtn.visible{ animation: installPulse 1.8s ease-in-out infinite; }
  .exit-btn{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    justify-content:center;
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    background:rgba(10,14,26,0.4);
    color:var(--muted);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    z-index:6;
    transition: border-color .2s ease, color .2s ease, transform .15s ease;
  }
  .exit-btn.visible{ display:flex; }
  .exit-btn:hover{ border-color:var(--danger); color:var(--danger); }
  .exit-btn:active{ transform:translateX(-50%) scale(0.9); }
  .lang-switch{
    position:fixed;
    top: max(14px, env(safe-area-inset-top));
    right:16px;
    display:flex;
    gap:6px;
    z-index:11;
  }
  .lang-switch.hidden{ display:none; }
  .lang-btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.08em;
    padding:6px 12px;
    border-radius:100px;
    border:1.5px solid var(--muted);
    color:var(--muted);
    background:rgba(10,14,26,0.4);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  .lang-btn.active{ border-color:var(--player); color:var(--player); }
  .lang-btn:hover{ border-color:var(--player); }
  .lb-heading{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:28px;
    color:var(--player);
    margin:0 0 16px 0;
  }
  .lb-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .lb-tab{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:8px 18px;
    border-radius:100px;
    border:1.5px solid var(--muted);
    color:var(--muted);
    background:transparent;
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  .lb-tab.active{
    border-color:var(--player);
    color:var(--player);
  }
  .leaderboard-list{
    width:100%;
    max-width:320px;
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:22px;
    max-height:50vh;
    overflow-y:auto;
    text-align:left;
  }
  .lb-row{ display:flex; align-items:center; gap:10px; font-size:13px; padding:5px 4px; }
  .lb-rank{ width:24px; color:var(--muted); flex-shrink:0; }
  .lb-name{ flex:1; color:var(--text); letter-spacing:0.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-score{ color:var(--treasure); font-weight:600; }
  .lb-empty, .lb-error{ color:var(--muted); font-size:13px; padding:20px 0; }
  .score-entry{
    display:none;
    flex-direction:column; align-items:center; gap:10px;
    margin-bottom:20px;
  }
  .score-entry.visible{ display:flex; }
  .score-entry-label{ font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:var(--treasure); }
  .nickname-input{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:16px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-align:center;
    width:200px;
    padding:10px;
    border-radius:10px;
    border:1.5px solid var(--player);
    background:transparent;
    color:var(--text);
    outline:none;
  }
  .nickname-input:focus{ box-shadow:0 0 16px var(--player-glow); }
  .score-entry-status{ font-size:12px; color:var(--player); letter-spacing:0.1em; min-height:14px; }
  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
    #installBtn.visible{ animation:none; }
    .exit-btn{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="score"><span id="scoreLabel">SCORE</span> <b id="hudScore">0</b></div>
  <div class="echoes"><span id="threatsLabel">THREATS</span> <b id="hudEchoes">0</b></div>
</div>

<button class="exit-btn" id="exitBtn" aria-label="Back to menu">✕</button>

<div class="lang-switch" id="langSwitch">
  <button class="lang-btn active" id="langEnBtn">EN</button>
  <button class="lang-btn" id="langPlBtn">PL</button>
</div>

<div class="overlay" id="startScreen">
  <div class="title">SwipeEcho</div>
  <div class="legend">
    <div class="legend-row">
      <div class="dot player"></div>
      <div class="legend-text" id="legendPlayer"><b>You</b> - control</div>
    </div>
    <div class="legend-row">
      <div class="dot danger"></div>
      <div class="legend-text" id="legendEcho"><b>Echo</b> - enemy</div>
    </div>
    <div class="legend-row">
      <div class="dot treasure"></div>
      <div class="legend-text" id="legendCoins"><b>Coins</b> - collect</div>
    </div>
  </div>
  <button class="btn" id="startBtn">Start</button>
  <button class="btn btn-secondary visible" id="rankingBtn">Leaderboard</button>
  <button class="btn btn-secondary" id="installBtn">Install</button>
  <button class="mute-btn" id="muteBtn" aria-label="Mute sound">🔊</button>
  <div class="version-badge" id="versionBadge"></div>
  <button class="btn btn-secondary btn-muted" id="exitAppBtn">Exit</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="go-label" id="goLabel">game over</div>
  <div class="go-score" id="finalScore">0</div>
  <div class="go-best" id="bestScoreLine">best: 0</div>
  <div class="score-entry" id="scoreEntry">
    <div class="score-entry-label" id="scoreEntryLabel">You're in the TOP 100!</div>
    <input class="nickname-input" id="nicknameInput" maxlength="12" placeholder="NICKNAME" autocomplete="off">
    <button class="btn" id="submitScoreBtn">Save score</button>
    <div class="score-entry-status" id="scoreEntryStatus"></div>
  </div>
  <button class="btn" id="retryBtn">Retry</button>
  <button class="btn btn-secondary visible" id="menuBtn">Menu</button>
  <button class="btn btn-secondary visible" id="rankingBtnGameOver">Leaderboard</button>
</div>

<div class="overlay hidden" id="leaderboardScreen">
  <div class="lb-heading" id="lbHeading">Leaderboard</div>
  <div class="lb-tabs">
    <button class="lb-tab" id="lbTabMobile" data-platform="MOBILE">Phone</button>
    <button class="lb-tab" id="lbTabPc" data-platform="PC">PC</button>
  </div>
  <div class="leaderboard-list" id="leaderboardList"></div>
  <button class="btn" id="closeLeaderboardBtn">Close</button>
</div>

<script>
/* Konwencja wersjonowania jak w Ubieranko: MAJOR.MILESTONE.PATCH, start od 0.000.001.
   Trzeci człon rośnie przy drobnych poprawkach, drugi (z resetem trzeciego do 000) przy
   nowych funkcjach/kamieniach milowych. */
const APP_VERSION = "0.011.005";

(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hudScore = document.getElementById('hudScore');
  const hudEchoes = document.getElementById('hudEchoes');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreLine = document.getElementById('bestScoreLine');
  const leaderboardScreen = document.getElementById('leaderboardScreen');
  const leaderboardList = document.getElementById('leaderboardList');
  const exitBtn = document.getElementById('exitBtn');

  document.getElementById('versionBadge').textContent = 'v' + APP_VERSION;

  // ---- language (EN default, PL switchable) ----
  const I18N = {
    en: {
      htmlLang: 'en',
      scoreLabel: 'SCORE',
      threatsLabel: 'THREATS',
      legendPlayer: '<b>You</b> - control',
      legendEcho: '<b>Echo</b> - avoid',
      legendCoins: '<b>Coins</b> - collect',
      start: 'Start',
      leaderboard: 'Leaderboard',
      install: 'Install',
      exit: 'Exit',
      exitToMenu: 'Back to menu',
      muteMenuMusic: 'Mute sound',
      unmuteMenuMusic: 'Unmute sound',
      gameOver: 'game over',
      best: 'best: ',
      top100: "You're in the TOP 100!",
      nicknamePlaceholder: 'NICKNAME',
      saveScore: 'Save score',
      saving: 'Saving…',
      saved: 'Saved!',
      saveFailed: 'Failed to save, try again.',
      retry: 'Retry',
      menu: 'Menu',
      phone: 'Phone',
      pc: 'PC',
      close: 'Close',
      noScores: 'No scores yet. Be the first!',
      loading: 'Loading…',
      loadFailed: 'Failed to load leaderboard.',
    },
    pl: {
      htmlLang: 'pl',
      scoreLabel: 'WYNIK',
      threatsLabel: 'ZAGROŻENIA',
      legendPlayer: '<b>Ty</b> - steruj',
      legendEcho: '<b>Echo</b> - unikaj',
      legendCoins: '<b>Monety</b> - zbieraj',
      start: 'Zacznij',
      leaderboard: 'Ranking',
      install: 'Zainstaluj',
      exit: 'Wyjdź',
      exitToMenu: 'Wróć do menu',
      muteMenuMusic: 'Wycisz dźwięk',
      unmuteMenuMusic: 'Włącz dźwięk',
      gameOver: 'przegrałeś',
      best: 'rekord: ',
      top100: 'Łapiesz się do TOP 100!',
      nicknamePlaceholder: 'KSYWKA',
      saveScore: 'Zapisz wynik',
      saving: 'Zapisywanie…',
      saved: 'Zapisano!',
      saveFailed: 'Nie udało się zapisać, spróbuj ponownie.',
      retry: 'Jeszcze raz',
      menu: 'Menu',
      phone: 'Telefon',
      pc: 'PC',
      close: 'Zamknij',
      noScores: 'Brak wyników. Bądź pierwszy!',
      loading: 'Ładowanie…',
      loadFailed: 'Nie udało się wczytać rankingu.',
    },
  };
  const LANG_KEY = 'echo-lang';
  function loadLang(){
    try{
      const v = window.localStorage.getItem(LANG_KEY);
      return (v === 'pl' || v === 'en') ? v : 'en';
    }catch(e){ return 'en'; }
  }
  function saveLang(v){
    try{ window.localStorage.setItem(LANG_KEY, v); }catch(e){}
  }
  let lang = loadLang();
  function t(key){ return I18N[lang][key]; }

  const langSwitch = document.getElementById('langSwitch');
  const langEnBtn = document.getElementById('langEnBtn');
  const langPlBtn = document.getElementById('langPlBtn');
  const scoreLabelEl = document.getElementById('scoreLabel');
  const threatsLabelEl = document.getElementById('threatsLabel');
  const legendPlayerEl = document.getElementById('legendPlayer');
  const legendEchoEl = document.getElementById('legendEcho');
  const legendCoinsEl = document.getElementById('legendCoins');
  const goLabelEl = document.getElementById('goLabel');
  const scoreEntryLabelEl = document.getElementById('scoreEntryLabel');
  const lbHeadingEl = document.getElementById('lbHeading');

  function applyLanguage(){
    document.documentElement.lang = t('htmlLang');
    scoreLabelEl.textContent = t('scoreLabel');
    threatsLabelEl.textContent = t('threatsLabel');
    legendPlayerEl.innerHTML = t('legendPlayer');
    legendEchoEl.innerHTML = t('legendEcho');
    legendCoinsEl.innerHTML = t('legendCoins');
    document.getElementById('startBtn').textContent = t('start');
    document.getElementById('rankingBtn').textContent = t('leaderboard');
    document.getElementById('rankingBtnGameOver').textContent = t('leaderboard');
    installBtn.textContent = t('install');
    document.getElementById('exitAppBtn').textContent = t('exit');
    exitBtn.setAttribute('aria-label', t('exitToMenu'));
    goLabelEl.textContent = t('gameOver');
    bestScoreLine.textContent = t('best') + bestScore;
    scoreEntryLabelEl.textContent = t('top100');
    nicknameInput.setAttribute('placeholder', t('nicknamePlaceholder'));
    submitScoreBtn.textContent = t('saveScore');
    document.getElementById('retryBtn').textContent = t('retry');
    document.getElementById('menuBtn').textContent = t('menu');
    lbHeadingEl.textContent = t('leaderboard');
    lbTabMobile.textContent = t('phone');
    lbTabPc.textContent = t('pc');
    document.getElementById('closeLeaderboardBtn').textContent = t('close');
    applyMenuMuted();
    langEnBtn.classList.toggle('active', lang === 'en');
    langPlBtn.classList.toggle('active', lang === 'pl');
  }
  langEnBtn.addEventListener('click', () => { lang = 'en'; saveLang(lang); applyLanguage(); });
  langPlBtn.addEventListener('click', () => { lang = 'pl'; saveLang(lang); applyLanguage(); });

  // ---- install prompt (browsers don't always surface their own) ----
  const installBtn = document.getElementById('installBtn');
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.classList.add('visible');
  });
  installBtn.addEventListener('click', async () => {
    if(!deferredInstallPrompt) return;
    installBtn.disabled = true;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.classList.remove('visible');
    installBtn.disabled = false;
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    installBtn.classList.remove('visible');
  });

  // ---- exit button (only meaningful once installed — there's no "quit" for a
  // browser tab, but a standalone/fullscreen PWA window has no back button either) ----
  const exitAppBtn = document.getElementById('exitAppBtn');
  function isStandaloneApp(){
    return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;
  }
  if(isStandaloneApp()) exitAppBtn.classList.add('visible');
  exitAppBtn.addEventListener('click', () => { window.close(); });

  // ---- global leaderboard (Supabase, top 25) ----
  // Public/publishable key only — safe to embed client-side, real access control
  // lives in the DB's Row Level Security policies (see supabase/leaderboard.sql).
  // Everything here fails silently: the leaderboard is a nice-to-have, never
  // something the core game depends on.
  const SUPABASE_URL = "https://hwnvjtputpffjienhkxt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_nC8Be47Cw-r6_uT142N_dg_627fznbD";
  const LEADERBOARD_SIZE = 100;
  // Free-tier Supabase has no per-branch database, so dev and main share one table —
  // this tags every read/write so each build only ever sees its own scores.
  const LEADERBOARD_BRANCH = 'MAIN';

  // MOBILE vs PC, so the leaderboard can be split by device — touch-primary input
  // (coarse pointer) is a more reliable signal than user-agent sniffing alone, but
  // combining both catches edge cases either misses on its own.
  function detectPlatform(){
    const ua = navigator.userAgent || '';
    const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
    const isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return (isMobileUA || isCoarsePointer) ? 'MOBILE' : 'PC';
  }
  const PLAYER_PLATFORM = detectPlatform();
  let leaderboardFilter = PLAYER_PLATFORM; // which tab is showing — defaults to the viewer's own device

  let supabaseClientPromise = null;
  function getSupabaseClient(){
    if(!supabaseClientPromise){
      supabaseClientPromise = import("https://esm.sh/@supabase/supabase-js@2")
        .then(({ createClient }) => createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
    }
    return supabaseClientPromise;
  }

  // reads from the swipeecho_leaderboard view (see supabase/005_dedupe_leaderboard_view.sql)
  // instead of the raw table — it collapses repeat nickname+score submissions down
  // to the most recent row at the database level, so no client-side dedup is needed.
  async function fetchTopScores(platform){
    const client = await getSupabaseClient();
    const { data, error } = await client
      .from('swipeecho_leaderboard')
      .select('nickname,score')
      .eq('branch', LEADERBOARD_BRANCH)
      .eq('platform', platform)
      .order('score', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(LEADERBOARD_SIZE);
    if(error) throw error;
    return data;
  }

  async function qualifiesForLeaderboard(candidateScore){
    try{
      // always checked against the player's own device leaderboard, regardless of
      // which tab happens to be open in the ranking screen
      const rows = await fetchTopScores(PLAYER_PLATFORM);
      if(rows.length < LEADERBOARD_SIZE) return true;
      const lowest = rows[rows.length - 1].score;
      return candidateScore > lowest;
    }catch(e){
      return false;
    }
  }

  async function submitScore(nickname, scoreValue){
    const client = await getSupabaseClient();
    const { error } = await client.from('swipeecho_scores').insert({
      nickname, score: scoreValue, branch: LEADERBOARD_BRANCH, platform: PLAYER_PLATFORM
    });
    if(error) throw error;
  }

  function renderLeaderboard(rows){
    leaderboardList.innerHTML = '';
    if(rows.length === 0){
      const empty = document.createElement('div');
      empty.className = 'lb-empty';
      empty.textContent = t('noScores');
      leaderboardList.appendChild(empty);
      return;
    }
    rows.forEach((row, i) => {
      const line = document.createElement('div');
      line.className = 'lb-row';
      const rank = document.createElement('span');
      rank.className = 'lb-rank';
      rank.textContent = (i + 1) + '.';
      const name = document.createElement('span');
      name.className = 'lb-name';
      name.textContent = row.nickname;
      const pts = document.createElement('span');
      pts.className = 'lb-score';
      pts.textContent = row.score;
      line.append(rank, name, pts);
      leaderboardList.appendChild(line);
    });
  }

  const lbTabMobile = document.getElementById('lbTabMobile');
  const lbTabPc = document.getElementById('lbTabPc');
  function updateLbTabs(){
    lbTabMobile.classList.toggle('active', leaderboardFilter === 'MOBILE');
    lbTabPc.classList.toggle('active', leaderboardFilter === 'PC');
  }

  async function loadLeaderboardTab(){
    updateLbTabs();
    leaderboardList.innerHTML = '';
    const loading = document.createElement('div');
    loading.className = 'lb-empty';
    loading.textContent = t('loading');
    leaderboardList.appendChild(loading);
    try{
      const rows = await fetchTopScores(leaderboardFilter);
      renderLeaderboard(rows);
    }catch(e){
      leaderboardList.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'lb-error';
      err.textContent = t('loadFailed');
      leaderboardList.appendChild(err);
    }
  }

  function openLeaderboard(){
    leaderboardScreen.classList.remove('hidden');
    leaderboardFilter = PLAYER_PLATFORM; // reset to "your" tab each time it's opened
    loadLeaderboardTab();
  }

  lbTabMobile.addEventListener('click', () => { leaderboardFilter = 'MOBILE'; loadLeaderboardTab(); });
  lbTabPc.addEventListener('click', () => { leaderboardFilter = 'PC'; loadLeaderboardTab(); });

  document.getElementById('rankingBtn').addEventListener('click', openLeaderboard);
  document.getElementById('rankingBtnGameOver').addEventListener('click', openLeaderboard);
  document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
    leaderboardScreen.classList.add('hidden');
  });

  const scoreEntry = document.getElementById('scoreEntry');
  const nicknameInput = document.getElementById('nicknameInput');
  const submitScoreBtn = document.getElementById('submitScoreBtn');
  const scoreEntryStatus = document.getElementById('scoreEntryStatus');
  let pendingScore = 0;

  // ---- remember the last nickname used, so it doesn't have to be retyped every run ----
  const NICKNAME_KEY = 'echo-nickname';
  function loadNickname(){
    try{ return window.localStorage.getItem(NICKNAME_KEY) || ''; }catch(e){ return ''; }
  }
  function saveNickname(v){
    try{ window.localStorage.setItem(NICKNAME_KEY, v); }catch(e){}
  }

  async function offerScoreEntry(finalScoreValue){
    pendingScore = finalScoreValue;
    scoreEntry.classList.remove('visible');
    nicknameInput.value = loadNickname();
    nicknameInput.disabled = false;
    submitScoreBtn.disabled = false;
    scoreEntryStatus.textContent = '';
    const qualifies = await qualifiesForLeaderboard(finalScoreValue);
    // the player may have already started a new run by the time this resolves
    if(state !== 'dead') return;
    if(qualifies) scoreEntry.classList.add('visible');
  }

  submitScoreBtn.addEventListener('click', async () => {
    const nickname = nicknameInput.value.trim().toUpperCase().slice(0, 12);
    if(!nickname) return;
    nicknameInput.disabled = true;
    submitScoreBtn.disabled = true;
    scoreEntryStatus.textContent = t('saving');
    try{
      await submitScore(nickname, pendingScore);
      saveNickname(nickname);
      scoreEntryStatus.textContent = t('saved');
    }catch(e){
      scoreEntryStatus.textContent = t('saveFailed');
      nicknameInput.disabled = false;
      submitScoreBtn.disabled = false;
    }
  });

  // portrait-only: the manifest's "orientation":"portrait" locks it once installed,
  // but this also tries the Screen Orientation API directly for browser tabs — it
  // only succeeds in fullscreen contexts on most mobile browsers, so the failure is
  // expected/harmless everywhere else and just silently ignored.
  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock('portrait').catch(() => {});
  }

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- music: menu theme on the menus, main theme during a run ----
  const menuMusic = new Audio('assets/audio/menu-theme.mp3');
  menuMusic.loop = true;
  menuMusic.volume = 0.45125; // another 5% down from 0.475

  // mute applies to everything: menu theme (via the <audio> element's .muted)
  // plus the in-run main theme and sfx, which run through masterGain below.
  // (declared here, ahead of the audioCtx setup, so applyMenuMuted's initial
  // call below doesn't hit it before its own declaration has run)
  let masterGain = null;
  const MUTE_KEY = 'echo-menu-muted';
  const muteBtn = document.getElementById('muteBtn');
  function loadMenuMuted(){
    try{ return window.localStorage.getItem(MUTE_KEY) === '1'; }catch(e){ return false; }
  }
  function saveMenuMuted(v){
    try{ window.localStorage.setItem(MUTE_KEY, v ? '1' : '0'); }catch(e){}
  }
  let menuMuted = loadMenuMuted();
  function applyMenuMuted(){
    menuMusic.muted = menuMuted;
    if(masterGain) masterGain.gain.value = menuMuted ? 0 : 1;
    muteBtn.textContent = menuMuted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', menuMuted ? t('unmuteMenuMusic') : t('muteMenuMusic'));
  }
  applyMenuMuted();
  muteBtn.addEventListener('click', () => {
    menuMuted = !menuMuted;
    saveMenuMuted(menuMuted);
    applyMenuMuted();
  });

  // Native <audio> looping isn't gapless with MP3 (the LAME encoder pads the file
  // with a few silent samples, which native loop plays back as an audible click/gap
  // at the seam). The main theme needs a hard zero-gap loop, so it's decoded once
  // into a raw buffer and looped sample-accurately via the Web Audio API instead.
  const MAIN_THEME_VOLUME = 0.5;
  let audioCtx = null;
  let mainThemeBufferPromise = null;
  let mainThemeSource = null;

  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = menuMuted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
    }
    return audioCtx;
  }
  function loadMainTheme(){
    if(!mainThemeBufferPromise){
      const ctx = getAudioCtx();
      mainThemeBufferPromise = fetch('assets/audio/main-theme.mp3')
        .then(res => res.arrayBuffer())
        .then(data => ctx.decodeAudioData(data));
    }
    return mainThemeBufferPromise;
  }
  loadMainTheme().catch(() => {}); // decode ahead of time so playback starts instantly

  // synthesized coin-pickup blip — no audio file, just an oscillator + a fast
  // volume envelope so it doesn't click on start/stop. Two quick notes, low then
  // high, like a classic arcade coin sound.
  function playCoinSound(){
    try{
      const ctx = getAudioCtx();
      if(ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      osc.type = 'triangle'; // rounder, bassier than square's buzzy harmonics
      const gain = ctx.createGain();
      osc.connect(gain).connect(masterGain);

      osc.frequency.setValueAtTime(494, now);         // B4 — down an octave
      osc.frequency.setValueAtTime(784, now + 0.06);  // G5 — down an octave

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.21175, now + 0.01); // another 10% up from 0.1925
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

      osc.start(now);
      osc.stop(now + 0.2);
    }catch(e){}
  }

  function stopMainMusic(){
    if(mainThemeSource){
      try{ mainThemeSource.stop(); }catch(e){}
      mainThemeSource.disconnect();
      mainThemeSource = null;
    }
  }

  function playMenuMusic(){
    stopMainMusic();
    menuMusic.play().catch(() => {});
  }
  async function playMainMusic(){
    menuMusic.pause();
    stopMainMusic();
    try{
      const ctx = getAudioCtx();
      if(ctx.state === 'suspended') await ctx.resume();
      const buffer = await loadMainTheme();
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      const gain = ctx.createGain();
      gain.gain.value = MAIN_THEME_VOLUME;
      source.connect(gain).connect(masterGain);
      source.start(0);
      mainThemeSource = source;
    }catch(e){}
  }

  // browsers block autoplay before any user interaction — try immediately (works
  // once installed/re-launched with an interaction already "spent"), and again on
  // the first tap/click/key anywhere as a guaranteed fallback.
  playMenuMusic();
  function retryMenuMusicOnce(){
    if(state !== 'playing') playMenuMusic();
    window.removeEventListener('pointerdown', retryMenuMusicOnce);
    window.removeEventListener('keydown', retryMenuMusicOnce);
  }
  window.addEventListener('pointerdown', retryMenuMusicOnce);
  window.addEventListener('keydown', retryMenuMusicOnce);

  // ---- stop audio when backgrounded/minimized — otherwise the menu <audio>
  // element and the Web Audio context keep decoding/playing silently behind the
  // OS, which is exactly what drains battery on a phone even after "closing" the
  // app (a minimized PWA tab isn't actually killed until the OS reclaims it) ----
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      menuMusic.pause();
      if(audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
    } else {
      if(state === 'playing'){
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      } else {
        playMenuMusic();
      }
    }
  });

  // ---- persistence (personal best) ----
  const BEST_KEY = 'echo-best-score';
  let bestScore = 0;
  function loadBest(){
    try{
      const v = window.localStorage.getItem(BEST_KEY);
      if(v) bestScore = parseInt(v) || 0;
    }catch(e){}
  }
  function saveBest(v){
    try{ window.localStorage.setItem(BEST_KEY, String(v)); }catch(e){}
  }
  loadBest();
  applyLanguage();

  // ---- input ----
  let pointer = null;
  function setPointer(clientX, clientY){ pointer = { x: clientX, y: clientY }; }
  canvas.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; if(t) setPointer(t.clientX,t.clientY); }, {passive:false});
  canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; if(t) setPointer(t.clientX,t.clientY); }, {passive:false});

  // ---- tuning ----
  const PLAYER_R = 9;
  const ECHO_R = 8;
  const SPARK_R = 7;
  const RECORD_INTERVAL = 4.6;    // seconds between new echoes being born — spawning never stops
  const RECORD_STEP = 1000/45;
  const SAMPLE_RATE = 1000/RECORD_STEP; // samples/sec the trail is recorded at
  const TRAIL_DURATION = 15.0;    // seconds of player movement each echo remembers
  const MAX_TRAIL_SAMPLES = Math.round(TRAIL_DURATION * SAMPLE_RATE);

  // echo playback speed ramps up over the course of a run, with no ceiling: very slow,
  // forgiving start, relentlessly faster the longer you survive.
  const ECHO_SPEED_START = 0.25;
  const ECHO_SPEED_ACCEL = 0.01; // added to the multiplier per second, unbounded

  // a freshly spawned echo is intangible and flickers for a couple seconds before
  // it can actually kill you — gives a beat to notice and react to it.
  const SPAWN_GRACE = 3.0;

  let state = 'idle';
  let player, echoes, trail, recTimer, sparkPos, score, elapsed, lastTime, sampleAcc;

  function resetGame(){
    player = { x: W/2, y: H/2 };
    if(!pointer) pointer = { x: W/2, y: H/2 };
    echoes = [];
    trail = [];
    recTimer = 0;
    score = 0;
    elapsed = 0;
    sampleAcc = 0;
    sparkPos = randomSpark();
    updateHud();
  }

  // bounces a continuously-growing position back and forth across [0, len-1]
  // instead of wrapping it, so playback reverses smoothly with no jump-cut.
  function pingpongPos(x, len){
    if(len <= 1) return 0;
    const period = 2 * (len - 1);
    let t = x % period;
    if(t < 0) t += period;
    return t <= (len - 1) ? t : period - t;
  }

  function randomSpark(){
    const pad = 60;
    return { x: pad + Math.random()*(W-pad*2), y: pad + Math.random()*(H-pad*2) };
  }

  function updateHud(){
    hudScore.textContent = score;
    hudEchoes.textContent = echoes.length;
  }

  function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

  function echoSpeedMultiplier(){
    return ECHO_SPEED_START + ECHO_SPEED_ACCEL * elapsed;
  }

  function startGame(){
    resetGame();
    // hard-clear the canvas so a new run never starts on top of the previous
    // run's leftover trail — render() only ever paints a translucent overlay,
    // it never wipes the board on its own.
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, W, H);
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    exitBtn.classList.add('visible');
    langSwitch.classList.add('hidden');
    playMainMusic();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    state = 'dead';
    exitBtn.classList.remove('visible');
    langSwitch.classList.remove('hidden');
    playMenuMusic();
    finalScoreEl.textContent = score;
    if(score > bestScore){ bestScore = score; saveBest(bestScore); }
    bestScoreLine.textContent = t('best') + bestScore;
    gameOverScreen.classList.remove('hidden');
    offerScoreEntry(score);
  }

  function backToMenu(){
    state = 'idle';
    exitBtn.classList.remove('visible');
    langSwitch.classList.remove('hidden');
    playMenuMusic();
    // same hard-clear as starting a new run — don't leave a frozen mid-game or
    // game-over frame behind the (blurred, semi-transparent) start screen.
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, W, H);
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  }
  function quitToMenu(){
    if(state !== 'playing') return;
    backToMenu();
  }
  exitBtn.addEventListener('click', quitToMenu);
  document.getElementById('menuBtn').addEventListener('click', backToMenu);

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  function update(dt){
    const follow = 1 - Math.pow(0.0025, dt);
    player.x += (pointer.x - player.x) * follow;
    player.y += (pointer.y - player.y) * follow;
    player.x = Math.max(PLAYER_R, Math.min(W-PLAYER_R, player.x));
    player.y = Math.max(PLAYER_R, Math.min(H-PLAYER_R, player.y));

    sampleAcc += dt*1000;
    while(sampleAcc >= RECORD_STEP){
      trail.push({x:player.x, y:player.y});
      if(trail.length > MAX_TRAIL_SAMPLES) trail.shift();
      sampleAcc -= RECORD_STEP;
    }

    recTimer += dt;
    elapsed += dt;

    if(recTimer >= RECORD_INTERVAL && trail.length > 4){
      const path = trail.slice();
      echoes.push({ path, posAcc: 0, x: path[0].x, y: path[0].y, bornAt: elapsed });
      recTimer = 0;
    }

    const speed = echoSpeedMultiplier();

    // advance every echo ever recorded and check collisions — none of them expire,
    // so the field only ever gets more crowded the longer you survive. Each echo
    // bounces back and forth along its own (up to TRAIL_DURATION-long) trail instead
    // of jumping back to the start, and position is interpolated between recorded
    // samples so motion stays smooth at any speed.
    for(let i = 0; i < echoes.length; i++){
      const e = echoes[i];
      const len = e.path.length;

      e.posAcc += dt * SAMPLE_RATE * speed;
      const pos = pingpongPos(e.posAcc, len);
      const base = Math.floor(pos);
      const frac = pos - base;
      const a = e.path[base];
      const b = e.path[Math.min(base + 1, len - 1)];
      e.x = a.x + (b.x - a.x) * frac;
      e.y = a.y + (b.y - a.y) * frac;

      const touching = dist(player, e) < PLAYER_R + ECHO_R - 2;

      // freshly spawned echoes are intangible for SPAWN_GRACE seconds — they
      // flicker (see render()) but pass right through the player.
      if(touching && elapsed - e.bornAt >= SPAWN_GRACE){
        endGame();
        return;
      }
    }

    if(dist(player, sparkPos) < PLAYER_R + SPARK_R){
      score += 1;
      playCoinSound();
      sparkPos = randomSpark();
    }

    updateHud();
  }

  function glowDot(x, y, r, color, glowColor, glowSize){
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = glowSize;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function render(){
    ctx.fillStyle = 'rgba(10,14,26,0.22)';
    ctx.fillRect(0,0,W,H);

    const pulse = 1 + Math.sin(performance.now()/220)*0.12;
    glowDot(sparkPos.x, sparkPos.y, SPARK_R*pulse, '#fbbf24', 'rgba(251,191,36,0.65)', 16);

    for(const e of echoes){
      const age = elapsed - e.bornAt;
      if(age < SPAWN_GRACE){
        // fast flicker while intangible, telegraphing "can't hurt you yet"
        const flicker = Math.sin(performance.now() / 55) > 0 ? 0.85 : 0.15;
        ctx.save();
        ctx.globalAlpha = flicker;
        glowDot(e.x, e.y, ECHO_R, '#a78bfa', 'rgba(167,139,250,0.65)', 14);
        ctx.restore();
      } else {
        glowDot(e.x, e.y, ECHO_R, '#a78bfa', 'rgba(167,139,250,0.65)', 14);
      }
    }

    glowDot(player.x, player.y, PLAYER_R, '#5eead4', 'rgba(94,234,212,0.7)', 20);
  }

  function loop(now){
    if(state !== 'playing') return;
    const dt = Math.min((now - lastTime)/1000, 0.05);
    lastTime = now;
    update(dt);
    if(state === 'playing'){
      render();
      requestAnimationFrame(loop);
    }
  }

  function idleRender(){
    ctx.fillStyle = 'rgba(10,14,26,0.3)';
    ctx.fillRect(0,0,W,H);
    if(state !== 'playing') requestAnimationFrame(idleRender);
  }
  idleRender();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

<!-- Vercel Web Analytics — no build step here, so inject() is loaded straight from a
     CDN (same pattern as the Supabase client below) instead of via npm/@vercel/analytics.
     inject() only sends data when actually running on Vercel; it's a no-op elsewhere
     (localhost, GitHub Pages), and fails silently if the import itself can't load. -->
<script type="module">
  import('https://esm.sh/@vercel/analytics').then(({ inject }) => inject()).catch(() => {});
</script>
</body>
</html>
